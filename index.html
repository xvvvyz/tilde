<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark light" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>~</title>

<style>
  @font-face {
    font-family: 'SpaceGrotesk';
    font-style: normal;
    font-weight: normal;
    src: url('./fonts/SpaceGrotesk-Regular.woff2') format('woff2');
    font-display: swap;
  }

  @font-face {
    font-family: 'SpaceGrotesk';
    font-style: normal;
    font-weight: bold;
    src: url('./fonts/SpaceGrotesk-Bold.woff2') format('woff2');
    font-display: swap;
  }

  :root {
    --color-background: #111;
    --color-text-subtle: #888;
    --color-text: #eee;
    --color-text-faint: color-mix(in srgb, var(--color-text) 55%, transparent);
    --color-highlight: color-mix(in srgb, var(--color-text) 9%, transparent);
    --font-family: SpaceGrotesk, -apple-system, Helvetica, sans-serif;
    --font-size: clamp(16px, 1.5vw, 18px);
    --transition-speed: 200ms;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --color-background: #e8e8e8;
      --color-text-subtle: #606060;
      --color-text: #111;
    }
  }
</style>

<script type="module">
  /** @type {AppConfig} */
  const CONFIG = {
    commandPathDelimiter: '/',
    commandSearchDelimiter: ' ',
    defaultSearchTemplate: 'https://duckduckgo.com/?q={}',
    fallbackIconTemplate:
      'https://cdn.jsdelivr.net/gh/selfhst/icons/svg/{}.svg',
    iconTemplate: 'https://cdn.simpleicons.org/{}',
    logoTemplate:
      'https://cdn.jsdelivr.net/gh/pheralb/svgl@main/static/library/{}.svg',
    openLinksInNewTab: true,
    suggestionLimit: 10,
  };

  // self-hosted at <service>.xvyz.co, opened as x/<service>
  // prettier-ignore
  const SERVICES = ['audiobookshelf', 'bazarr', 'jellyfin', 'lidarr', 'nginx', 'nzbget', 'prowlarr', 'radarr', 'slskd', 'sonarr'];

  // named entries appear in the list, in insertion order. an icon is an svg url
  // or a slug, taken from the hostname unless set: the svgl logo if it has
  // several colors, else the simple icons glyph, else the selfhst icon.
  // suggestions are curated.
  /** @type {Map<string, Command>} */
  // prettier-ignore
  const COMMANDS = new Map([
    ['a', { name: 'Claude', suggestions: ['a/chatgpt', 'a/grok', 'a/gemini', 'a/lumo'], url: 'https://claude.ai/new' }],
    ['a/chatgpt', { icon: 'openai', url: 'https://chatgpt.com' }],
    ['a/gemini', { icon: 'gemini', url: 'https://gemini.google.com' }],
    ['a/grok', { url: 'https://grok.com' }],
    ['a/lumo', { icon: 'proton-lumo', url: 'https://lumo.proton.me/u/0' }],
    ['c', { name: 'Convex', url: 'https://dashboard.convex.dev' }],
    ['d', { name: 'Discord', url: 'https://discord.com/channels/@me' }],
    ['f', { name: 'Cloudflare', url: 'https://dash.cloudflare.com' }],
    ['g', { name: 'GitHub', searchTemplate: '/search?q={}', suggestions: ['g/copilot', 'g/trending'], url: 'https://github.com' }],
    ['o', { name: 'OpenRouter', url: 'https://openrouter.ai/models' }],
    ['p', { icon: 'protonmail', name: 'Proton', suggestions: ['p/drive', 'p/pass'], url: 'https://mail.proton.me/u/0/inbox' }],
    ['p/drive', { icon: 'protondrive', url: 'https://drive.proton.me/u/0' }],
    ['p/pass', { url: 'https://pass.proton.me/u/0' }],
    ['q', { icon: 'quickbooks', name: 'QuickBooks', url: 'https://qbo.intuit.com' }],
    ['s', { name: 'Slack', url: 'https://app.slack.com/client/T03VB9LJ0AF' }],
    ['t', { icon: 'https://cdn.jsdelivr.net/gh/selfhst/icons/svg/ticktick.svg', name: 'TickTick', url: 'https://ticktick.com/webapp/#q/today/tasks' }],
    ['x', { name: 'Tailscale', suggestions: SERVICES.map((service) => `x/${service}`), url: 'https://login.tailscale.com/admin' }],
    ...SERVICES.map((service) => [`x/${service}`, { icon: service, url: `https://${service}.xvyz.co` }]),
    ['y', { name: 'YouTube', searchTemplate: '/results?search_query={}', url: 'https://www.youtube.com/feed/subscriptions' }],
  ]);

  /**
   * @typedef {object} AppConfig
   * @property {string} commandPathDelimiter
   * @property {string} commandSearchDelimiter
   * @property {string} defaultSearchTemplate
   * @property {string} fallbackIconTemplate
   * @property {string} iconTemplate
   * @property {string} logoTemplate
   * @property {boolean} openLinksInNewTab
   * @property {number} suggestionLimit
   */

  /**
   * @typedef {object} Command
   * @property {string} url
   * @property {string=} icon
   * @property {string=} name
   * @property {string=} searchTemplate
   * @property {string[]=} suggestions
   */

  /**
   * @typedef {object} ParsedQuery
   * @property {string} query
   * @property {string} url
   * @property {string=} key
   * @property {string=} path
   * @property {string=} search
   * @property {string=} splitBy
   */

  /**
   * @param {string} id
   * @returns {HTMLTemplateElement}
   */
  function getTemplate(id) {
    const template = document.getElementById(id);

    if (!(template instanceof HTMLTemplateElement)) {
      throw new Error(`Template #${id} not found`);
    }

    return template;
  }

  const TEMPLATES = {
    command: getTemplate('command-template'),
    commands: getTemplate('commands-template'),
    icon: getTemplate('icon-template'),
    match: getTemplate('match-template'),
    search: getTemplate('search-template'),
    suggestion: getTemplate('suggestion-template'),
  };

  /**
   * @param {string} value
   * @returns {string}
   */
  function escapeRegexCharacters(value) {
    return value.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
  }

  /**
   * @param {string} template
   * @param {string} value
   * @returns {string}
   */
  function fillTemplate(template, value) {
    return template.replace(/{}/g, encodeURIComponent(value));
  }

  /**
   * @param {string} value
   * @returns {boolean}
   */
  function hasProtocol(value) {
    return /^[a-zA-Z]+:\/\//i.test(value);
  }

  /**
   * @param {string} value
   * @returns {boolean}
   */
  function isUrl(value) {
    return /^((https?:\/\/)?[\w-]+(\.[\w-]+)+\.?(:\d+)?(\/\S*)?)$/i.test(value);
  }

  /**
   * @param {string} value
   * @param {string} delimiter
   * @returns {[string, string?]}
   */
  function splitOnce(value, delimiter) {
    const delimiterIndex = value.indexOf(delimiter);

    if (delimiterIndex === -1) return [value];

    return [
      value.slice(0, delimiterIndex),
      value.slice(delimiterIndex + delimiter.length),
    ];
  }

  /**
   * @param {string} raw
   * @param {Map<string, Command>} commands
   * @param {AppConfig} config
   * @returns {ParsedQuery}
   */
  function parseQuery(raw, commands, config) {
    const query = raw.trim();

    if (isUrl(query)) {
      const url = hasProtocol(query) ? query : `https://${query}`;
      return { query, url };
    }

    if (commands.has(query)) {
      const { url } = commands.get(query);
      return { key: query, query, url };
    }

    let splitBy = config.commandSearchDelimiter;
    const [searchKey, rawSearch] = splitOnce(query, splitBy);

    // only a command with a search template searches, so a web search that
    // happens to start with a command's key is still a web search
    const searchCommand = commands.get(searchKey);

    if (searchCommand?.searchTemplate) {
      const template = new URL(searchCommand.searchTemplate, searchCommand.url);
      const search = rawSearch.trim();
      const url = fillTemplate(decodeURI(template.href), search);
      return { key: searchKey, query, search, splitBy, url };
    }

    splitBy = config.commandPathDelimiter;
    const [pathKey, path] = splitOnce(query, splitBy);

    if (commands.has(pathKey)) {
      const command = commands.get(pathKey);
      const url = `${new URL(command.url).origin}/${path}`;
      return { key: pathKey, path, query, splitBy, url };
    }

    const url = fillTemplate(config.defaultSearchTemplate, query);
    return { query, search: query, url };
  }

  /**
   * a command's own suggestions come first and in full; the rest, its
   * parent's first, must contain the query.
   *
   * @param {ParsedQuery} parsedQuery
   * @param {Map<string, Command>} commands
   * @param {AppConfig} config
   * @returns {string[]}
   */
  function collectLocalSuggestions({ query }, commands, config) {
    const parentKey = query.split(config.commandPathDelimiter)[0];

    const matches = [
      ...(commands.get(parentKey)?.suggestions ?? []),
      ...[...commands].flatMap(([key, command]) => [
        key,
        ...(command.suggestions ?? []),
      ]),
    ].filter((suggestion) => suggestion.includes(query));

    const own = commands.get(query)?.suggestions ?? [];
    const suggestions = new Set([...own, ...matches]);
    suggestions.delete(query);
    return [...suggestions];
  }

  /**
   * @param {string} search
   * @returns {Promise<string[]>}
   */
  function fetchDuckDuckGoSuggestions(search) {
    return new Promise((resolve) => {
      window.autocompleteCallback = (response) => {
        resolve(
          response
            .map((item) => item.phrase)
            .filter((phrase) => phrase !== search.toLowerCase())
        );
      };

      const script = document.createElement('script');
      document.head.append(script);
      script.src = `https://duckduckgo.com/ac/?callback=autocompleteCallback&q=${encodeURIComponent(search)}`;

      const settle = () => {
        script.remove();
        resolve([]);
      };

      script.onload = settle;
      script.onerror = settle;
    });
  }

  /** @type {Map<string, Promise<string>>} */
  const ICONS = new Map();

  // icons that have arrived, so a re-rendered suggestion shows its icon at
  // once instead of fading it in again
  /** @type {Map<string, string>} */
  const LOADED_ICONS = new Map();

  /**
   * @param {{ icon?: string, url: string }} target
   * @returns {string}
   */
  function resolveIcon({ icon, url }) {
    return icon ?? new URL(url).hostname.split('.').at(-2);
  }

  /**
   * @param {string} icon
   * @returns {Promise<string>}
   */
  function loadIcon(icon) {
    if (!ICONS.has(icon)) {
      ICONS.set(
        icon,
        fetchIcon(icon).then((svg) => {
          LOADED_ICONS.set(icon, svg);
          return svg;
        })
      );
    }

    return ICONS.get(icon);
  }

  /**
   * a typed url gets no icon, so its hostname is never sent to the icon cdn
   *
   * @param {ParsedQuery} parsedQuery
   * @param {Map<string, Command>} commands
   * @returns {string | undefined}
   */
  function resolveQueryIcon({ key, search, url }, commands) {
    const command = commands.get(key);
    if (command) return resolveIcon(command);
    if (search !== undefined) return resolveIcon({ url });
  }

  /**
   * @param {string} icon
   * @returns {Promise<string>}
   */
  async function fetchIcon(icon) {
    const cacheKey = `logo:${icon}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) return cached;

    const svg = await (URL.canParse(icon) ? fetchSvg(icon) : fetchSlug(icon));
    if (!svg) throw new Error(`Icon not found: ${icon}`);
    localStorage.setItem(cacheKey, svg);
    return svg;
  }

  /**
   * @param {string} slug
   * @returns {Promise<string | null>}
   */
  async function fetchSlug(slug) {
    const logo = await fetchSvg(fillTemplate(CONFIG.logoTemplate, slug));
    if (logo && isMulticolor(logo)) return logo;
    const glyph = await fetchSvg(fillTemplate(CONFIG.iconTemplate, slug));
    return (
      glyph ?? logo ?? fetchSvg(fillTemplate(CONFIG.fallbackIconTemplate, slug))
    );
  }

  /**
   * @param {string} url
   * @returns {Promise<string | null>}
   */
  async function fetchSvg(url) {
    const response = await fetch(url);
    const svg = await response.text();
    return response.ok ? svg : null;
  }

  /**
   * @param {string} svg
   * @returns {boolean}
   */
  function isMulticolor(svg) {
    const paints = svg.matchAll(/(?:fill|stroke|stop-color)[=:]\s*"?([#\w]+)/g);

    const colors = [...paints]
      .map(([, paint]) => paint.toLowerCase())
      .filter((paint) => !['currentcolor', 'none', 'url'].includes(paint));

    return new Set(colors).size > 1;
  }

  /**
   * a brand color too dark or too light to show on both themes is dropped, so
   * the icon takes the text color instead.
   *
   * @param {string} svg
   * @returns {string | null}
   */
  function readBrandColor(svg) {
    const hex = svg.match(/fill="#(\w{6})"/)?.[1];
    if (!hex) return null;

    const [red, green, blue] = hex.match(/\w\w/g).map((channel) => {
      const value = parseInt(channel, 16) / 255;

      return value <= 0.04045
        ? value / 12.92
        : ((value + 0.055) / 1.055) ** 2.4;
    });

    const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
    return luminance > 0.06 && luminance < 0.6 ? `#${hex}` : null;
  }

  class CommandIcon extends HTMLElement {
    static observedAttributes = ['icon'];
    #icon;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.append(TEMPLATES.icon.content.cloneNode(true));
      this.#icon = this.shadowRoot.querySelector('.icon');
    }

    async attributeChangedCallback(attribute, previousIcon, icon) {
      if (icon === previousIcon) return;

      if (!LOADED_ICONS.has(icon)) {
        this.#icon.classList.remove('loaded');
        await loadIcon(icon).catch(() => null);
        if (this.getAttribute('icon') !== icon) return;
      }

      const svg = LOADED_ICONS.get(icon);
      this.toggleAttribute('missing', !svg);
      if (!svg) return;

      const dataUrl = `data:image/svg+xml,${encodeURIComponent(svg)}`;
      this.#icon.style.setProperty('--icon', `url("${dataUrl}")`);
      this.#icon.style.setProperty('--icon-color', readBrandColor(svg));
      this.#icon.classList.toggle('multicolor', isMulticolor(svg));
      this.#icon.classList.add('loaded');
    }
  }

  class CommandList extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const componentFragment = TEMPLATES.commands.content.cloneNode(true);
      const commands = componentFragment.querySelector('.commands');

      for (const [key, command] of COMMANDS) {
        const { name, url } = command;
        if (!name) continue;

        const commandFragment = TEMPLATES.command.content.cloneNode(true);
        const link = commandFragment.querySelector('.command');
        link.href = url;
        if (CONFIG.openLinksInNewTab) link.target = '_blank';
        const icon = commandFragment.querySelector('.icon');
        icon.setAttribute('icon', resolveIcon(command));
        icon.textContent = name[0];
        commandFragment.querySelector('.key').textContent = key;
        commandFragment.querySelector('.name').textContent = name;
        commands.append(commandFragment);
      }

      this.shadowRoot.append(componentFragment);
    }
  }

  class SearchOverlay extends HTMLElement {
    #dialog;
    #input;
    #reveal;
    #suggestions;
    #targetIcon;
    #targetLabel;
    #lastSuggestions = [];
    #pendingSearch = null;
    #suggestionRequest = Promise.resolve([]);
    #closeController = null;
    #documentController = null;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const componentFragment = TEMPLATES.search.content.cloneNode(true);
      const form = componentFragment.querySelector('.form');
      form.style.setProperty('--suggestion-limit', CONFIG.suggestionLimit);
      this.#dialog = componentFragment.querySelector('.dialog');
      this.#input = componentFragment.querySelector('.input');
      this.#reveal = componentFragment.querySelector('.reveal');
      this.#suggestions = componentFragment.querySelector('.suggestions');
      this.#targetIcon = componentFragment.querySelector('.target-icon');
      this.#targetLabel = componentFragment.querySelector('.target-label');
      form.addEventListener('focusin', this.#renderTarget);
      form.addEventListener('submit', this.#onSubmit);
      this.#input.addEventListener('input', this.#onInput);
      this.#suggestions.addEventListener('click', this.#onSuggestionClick);
      this.#suggestions.addEventListener('pointerleave', this.#renderTarget);
      this.#suggestions.addEventListener('pointermove', this.#onPointerMove);
      this.shadowRoot.append(componentFragment);
    }

    connectedCallback() {
      if (this.#documentController) return;

      this.#documentController = new AbortController();
      const { signal } = this.#documentController;
      document.addEventListener('click', this.#onClick, { signal });
      document.addEventListener('keydown', this.#onKeydown, { signal });
      document.addEventListener('paste', this.#onPaste, { signal });
    }

    disconnectedCallback() {
      this.#documentController?.abort();
      this.#documentController = null;
      this.#cancelPendingClose();
    }

    #cancelPendingClose() {
      this.#closeController?.abort();
      this.#closeController = null;
    }

    #reset() {
      this.#input.value = '';
      this.#input.blur();
      this.#suggestions.innerHTML = '';
    }

    #prepareOpen() {
      this.#cancelPendingClose();
      // closing leaves the height as it was, so nothing moves as it fades out
      this.#fitSuggestions();
      this.#dialog.show();
      this.#input.focus();
    }

    #open() {
      this.#prepareOpen();
      requestAnimationFrame(() => this.#dialog.classList.add('visible'));
    }

    #close() {
      this.#cancelPendingClose();
      this.#closeController = new AbortController();
      this.#dialog.classList.remove('visible');
      this.#reset();

      this.#dialog.addEventListener(
        'transitionend',
        () => {
          if (!this.#dialog.classList.contains('visible')) {
            this.#dialog.close();
          }

          this.#closeController = null;
        },
        { once: true, signal: this.#closeController.signal }
      );
    }

    #hideImmediately() {
      this.#cancelPendingClose();
      this.#reset();
      this.#dialog.close();
    }

    #execute(query) {
      const target = CONFIG.openLinksInNewTab ? '_blank' : '_self';
      const parsedQuery = parseQuery(query, COMMANDS, CONFIG);
      window.open(parsedQuery.url, target, 'noopener noreferrer');
      this.#close();
    }

    #setPointing(pointing) {
      this.#suggestions.classList.toggle('pointing', pointing);
      this.#renderTarget();
    }

    #completeSuggestion() {
      const suggestion =
        this.shadowRoot.activeElement?.dataset.suggestion ??
        this.#suggestions.querySelector('.suggestion')?.dataset.suggestion;

      if (!suggestion) return;
      this.#input.value = suggestion;
      this.#input.focus();
      this.#onInput();
    }

    // duckduckgo answers every request through the same callback, so requests
    // run one at a time and a search that has been superseded is skipped
    #fetchSuggestions(search) {
      this.#pendingSearch = search;

      this.#suggestionRequest = this.#suggestionRequest.then(() =>
        search === this.#pendingSearch ? fetchDuckDuckGoSuggestions(search) : []
      );

      return this.#suggestionRequest;
    }

    #focusNextSuggestion(previous = false) {
      const activeIndex = this.shadowRoot.activeElement?.dataset.index;
      let nextIndex;

      if (activeIndex) {
        nextIndex = Number(activeIndex) + (previous ? -1 : 1);
      } else {
        nextIndex = previous ? this.#suggestions.childElementCount - 1 : 0;
      }

      const nextItem = this.#suggestions.children[nextIndex];
      if (nextItem) nextItem.querySelector('.suggestion').focus();
      else this.#input.focus();
    }

    #onClick = (event) => {
      const path = event.composedPath();

      if (!this.#dialog.classList.contains('visible')) {
        // tapping opens search on touch screens; on desktop, typing does
        const isTouch = !matchMedia('(hover: hover)').matches;
        const onLink = path.some(
          (element) => element instanceof HTMLAnchorElement
        );
        if (isTouch && !onLink) this.#open();
        return;
      }

      if (!path.includes(this.#input) && !path.includes(this.#suggestions)) {
        this.#close();
      }
    };

    #onInput = async () => {
      const parsedQuery = parseQuery(this.#input.value, COMMANDS, CONFIG);
      this.#renderTarget();

      if (!parsedQuery.query) {
        // closing on a touch screen would dismiss the keyboard mid-edit
        if (matchMedia('(hover: hover)').matches) this.#close();
        else this.#renderSuggestions([], parsedQuery.query);
        return;
      }

      const isSearch = parsedQuery.search?.length > 1;
      let suggestions = collectLocalSuggestions(parsedQuery, COMMANDS, CONFIG);

      const suggestionsWithStale = [
        ...suggestions,
        ...this.#lastSuggestions.filter((suggestion) =>
          suggestion.includes(parsedQuery.query)
        ),
      ].slice(0, CONFIG.suggestionLimit);

      if (suggestionsWithStale.length || !isSearch) {
        this.#renderSuggestions(suggestionsWithStale, parsedQuery.query);
      }

      if (isSearch) {
        const results = await this.#fetchSuggestions(parsedQuery.search);
        const currentQuery = parseQuery(this.#input.value, COMMANDS, CONFIG);
        if (currentQuery.query !== parsedQuery.query) return;

        const duckDuckGoSuggestions = parsedQuery.splitBy
          ? results.map(
              (search) => `${parsedQuery.key}${parsedQuery.splitBy}${search}`
            )
          : results;

        this.#lastSuggestions = duckDuckGoSuggestions;

        suggestions = [...suggestions, ...duckDuckGoSuggestions].slice(
          0,
          CONFIG.suggestionLimit
        );

        this.#renderSuggestions(suggestions, parsedQuery.query);
      }
    };

    #onPaste = (event) => {
      if (this.#dialog.classList.contains('visible')) return;
      const text = event.clipboardData?.getData('text');
      if (!text) return;
      event.preventDefault();
      this.#open();
      this.#input.value = text;
      this.#onInput();
    };

    #onKeydown = (event) => {
      this.#setPointing(false);

      if (!this.#dialog.classList.contains('visible')) {
        if (event.key === 'Escape') {
          if (this.#dialog.open) {
            this.#hideImmediately();
          }

          return;
        }

        this.#prepareOpen();

        requestAnimationFrame(() => {
          // close the search dialog before the next repaint if a character is
          // not produced (e.g. if you type shift, control, alt etc.)
          if (!this.#input.value) {
            this.#hideImmediately();
          } else {
            this.#dialog.classList.add('visible');
          }
        });

        return;
      }

      if (event.key === 'Escape') {
        this.#close();
        return;
      }

      const { altKey, ctrlKey, key, metaKey, shiftKey } = event;
      const alt = altKey ? 'alt-' : '';
      const ctrl = ctrlKey ? 'ctrl-' : '';
      const meta = metaKey ? 'meta-' : '';
      const shift = shiftKey ? 'shift-' : '';
      const modifierPrefixedKey = `${alt}${ctrl}${meta}${shift}${key}`;

      if (/^(ArrowDown|ctrl-n)$/.test(modifierPrefixedKey)) {
        event.preventDefault();
        this.#focusNextSuggestion();
        return;
      }

      if (/^(ArrowUp|ctrl-p)$/.test(modifierPrefixedKey)) {
        event.preventDefault();
        this.#focusNextSuggestion(true);
        return;
      }

      if (key === 'Tab') {
        event.preventDefault();
        if (!shiftKey) this.#completeSuggestion();
        return;
      }

      const isTyping = key.length === 1 || key === 'Backspace';
      if (isTyping && !ctrlKey && !metaKey) this.#input.focus();
    };

    #onPointerMove = () => {
      this.#setPointing(true);
    };

    #onSubmit = () => {
      this.#execute(this.#input.value);
    };

    #onSuggestionClick = (event) => {
      const button = event.target.closest('.suggestion');
      if (!button) return;
      this.#execute(button.dataset.suggestion);
    };

    #renderTarget = () => {
      const highlighted =
        this.#suggestions.querySelector('.pointing .suggestion:hover') ??
        this.shadowRoot.activeElement;

      const parsedQuery = parseQuery(
        highlighted?.dataset.suggestion ?? this.#input.value,
        COMMANDS,
        CONFIG
      );

      const { key, url } = parsedQuery;
      const command = COMMANDS.get(key);
      const icon = resolveQueryIcon(parsedQuery, COMMANDS);
      this.#targetIcon.hidden = !icon;
      if (icon) this.#targetIcon.setAttribute('icon', icon);

      this.#targetLabel.textContent =
        command?.name ?? (URL.canParse(url) ? new URL(url).hostname : '');
    };

    #renderSuggestions(suggestions, query) {
      const focusedSuggestion =
        this.shadowRoot.activeElement?.dataset?.suggestion;

      this.#suggestions.innerHTML = '';
      const pattern = new RegExp(escapeRegexCharacters(query), 'i');

      for (const [index, suggestion] of suggestions.entries()) {
        const suggestionFragment = TEMPLATES.suggestion.content.cloneNode(true);
        const button = suggestionFragment.querySelector('.suggestion');
        button.dataset.index = index;
        button.dataset.suggestion = suggestion;
        const text = suggestionFragment.querySelector('.suggestion-text');
        const matched = suggestion.match(pattern);

        // an icon left unset keeps its space, so every suggestion lines up
        const icon = resolveQueryIcon(
          parseQuery(suggestion, COMMANDS, CONFIG),
          COMMANDS
        );

        if (icon) {
          suggestionFragment
            .querySelector('.suggestion-icon')
            .setAttribute('icon', icon);
        }

        if (matched) {
          const matchFragment = TEMPLATES.match.content.cloneNode(true);
          const match = matchFragment.querySelector('.match');
          const beforeMatch = suggestion.slice(0, matched.index);

          const afterMatch = suggestion.slice(
            matched.index + matched[0].length
          );

          match.textContent = matched[0];
          match.insertAdjacentText('beforebegin', beforeMatch);
          match.insertAdjacentText('afterend', afterMatch);
          text.append(matchFragment);
        } else {
          text.textContent = suggestion;
        }

        this.#suggestions.append(suggestionFragment);
      }

      this.#fitSuggestions();

      if (focusedSuggestion) {
        const buttonToRefocus = this.#suggestions.querySelector(
          `[data-suggestion="${CSS.escape(focusedSuggestion)}"]`
        );

        buttonToRefocus?.focus();
      }
    }

    // the list's height is set explicitly so that it can transition as
    // suggestions come and go
    #fitSuggestions() {
      this.#reveal.style.height = `${this.#suggestions.offsetHeight}px`;
    }
  }

  customElements.define('icon-component', CommandIcon);
  customElements.define('commands-component', CommandList);
  customElements.define('search-component', SearchOverlay);
</script>

      display: grid;
      font-weight: bold;
      height: 100%;
      opacity: 0;
      padding: 1px;
      place-items: center;
      text-transform: uppercase;
      transition: opacity var(--transition-speed);
    }

    .loaded,
    :host([missing]) .icon {
      opacity: 1;
    }

    .loaded {
      background-color: var(--icon-color, currentColor);
      mask: var(--icon) center / contain no-repeat content-box;
    }

    .multicolor {
      background: var(--icon) center / contain no-repeat content-box;
      mask: none;
    }

    :host(:not([missing])) slot {
      display: none;
    }
  </style>
  <div class="icon"><slot></slot></div>
</template>

      box-sizing: border-box;
      display: flex;
      justify-content: center;

      padding: 3rem 1rem;
    }

      display: grid;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .command {
      align-items: center;
      color: var(--color-text);
      display: flex;
      gap: 0.85rem;
      outline: 0;
      padding: 0.6rem 1.5rem;
      text-decoration: none;
      transition: color var(--transition-speed);
      white-space: nowrap;
    }

    .glyph {
      display: grid;
      flex: none;
      place-items: center;
    }

    .icon,
    .key {
      grid-area: 1 / 1;
    }

    .key {
      opacity: 0;
      transition: opacity var(--transition-speed);
    }

    .command:focus-visible {
      .icon {
        opacity: 0;
      }

      .key {
        opacity: 1;
      }
    }

    @media (hover: hover) {
      .commands:has(.command:hover) .command:not(:hover) {

        .icon {
          opacity: 0.55;
        }
      }

      .command:hover {
        .icon {
          opacity: 0;
        }

        .key {
          opacity: 1;
        }
      }
    }

    @media (min-width: 400px) {
      .commands {

<template id="search-template">
  <style>
    input,
    button {
      appearance: none;
      background: transparent;
      border: 0;
      display: block;
      font-family: var(--font-family);
      outline: 0;
    }

    .dialog {
      background: var(--color-background);
      border: none;
      height: 100%;
      left: 0;
      opacity: 0;
      padding: 0;
      top: 0;
      transform: translateY(10px);
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
      width: 100%;
    }

    .dialog.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --inset puts the label, input and suggestion text on one left edge.
       minmax(0, 1fr) keeps a long suggestion from widening the column, so it
       is cut off with an ellipsis instead */
    .form {
      --inset: 0.75rem;
      --list-gap: 1rem;
      --suggestion-height: 2.4rem;
      align-content: start;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      height: 100%;
      padding: 3rem 1rem 0;
      width: 100%;
    }

    .target {
      align-items: center;
      color: var(--color-text-subtle);
      display: flex;
      gap: 0.6rem;
      margin: 0 0 1rem;
      min-height: 1.4rem;
      padding: 0 var(--inset);
    }

    .target-icon:is([hidden], [missing]) {
      display: none;
    }

    .sr-only {
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    .input {
      box-sizing: border-box;
      color: var(--color-text);
      font-size: 2rem;
      font-weight: bold;
      line-height: 1.25;
      padding: 0 var(--inset);
      width: 100%;
    }

    .reveal {
      height: 0;
      overflow: clip;
      transition: height var(--transition-speed);
    }

    .suggestions {
      list-style: none;
      margin: 0;
      padding: var(--list-gap) 0 0;
    }

    .suggestions:empty {
      padding: 0;
    }

    .suggestion {
      align-items: center;
      border-radius: 0.6rem;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      font-size: 1rem;
      gap: 0.6rem;
      height: var(--suggestion-height);
      line-height: 1.4;
      padding: 0 var(--inset);
      text-align: left;
      transition: background-color var(--transition-speed);
      width: 100%;
    }

    .suggestion-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match {
      color: var(--color-text-subtle);
    }

    .suggestions.pointing .suggestion:hover,
    .suggestions:not(.pointing:has(.suggestion:hover)) .suggestion:focus {
      background-color: var(--color-highlight);
    }

    @media (min-width: 700px) and (hover: hover) {
      /* a fixed-width column centered as if the list were always full, so
         the label and input stay put as suggestions come and go. safe keeps
         the top on screen when the window is too short for the full list */
      .form {
        align-content: safe center;
        grid-template-rows:
          auto auto
          calc(
            var(--list-gap) + var(--suggestion-limit) * var(--suggestion-height)
          );
        margin: 0 auto;
        padding-block: 2rem;
        width: min(36rem, 100%);
      }

      .reveal {
        align-self: start;
      }
    }
  </style>
  <dialog class="dialog" aria-label="Search">
    <form autocomplete="off" class="form" method="dialog" spellcheck="false">
      <p class="target">
        <icon-component class="target-icon"></icon-component>
        <span class="target-label"></span>
      </p>
      <label for="search-input" class="sr-only">Search</label>
      <input class="input" id="search-input" type="text" />
      <div class="reveal">
        <menu class="suggestions"></menu>
      </div>
    </form>
  </dialog>
</template>

<template id="suggestion-template">
  <li>
    <button class="suggestion" type="button">
      <icon-component class="suggestion-icon"></icon-component>
      <span class="suggestion-text"></span>

  </li>
